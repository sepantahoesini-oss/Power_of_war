<script>
let token=sessionStorage.getItem('s8_admin')||'';
let catalog=null;
let players=[];

const $=id=>document.getElementById(id);

const fmt=n=>Number(n||0).toLocaleString('en-US');

const H=()=>({
  authorization:'Bearer '+token,
  'content-type':'application/json'
});

async function api(p,o={}){
  const r=await fetch(p,{
    cache:'no-store',
    ...o
  });

  const d=await r.json().catch(()=>({
    message:'خطا'
  }));

  if(!r.ok){
    throw Error(d.message||'خطا');
  }

  return d;
}

async function login(){
  try{
    const d=await api('/api/admin/login',{
      method:'POST',
      headers:{
        'content-type':'application/json'
      },
      body:JSON.stringify({
        password:$('password').value
      })
    });

    token=d.token;

    sessionStorage.setItem(
      's8_admin',
      token
    );

    showDash();
    openView('users');

  }catch(e){
    $('msg').textContent=e.message;
  }
}

function showDash(){
  $('login').style.display='none';
  $('dash').style.display='block';
}

function logout(){
  token='';
  sessionStorage.removeItem('s8_admin');
  location.reload();
}

function openView(id){

  document
    .querySelectorAll('.view')
    .forEach(x=>x.classList.remove('active'));

  $(id).classList.add('active');

  ({
    users:renderUsers,
    userlist:renderUserList,
    addplayer:renderAddPlayer,
    players:renderPlayers,
    grant:renderGrant,
    transactions:renderTransactions,
    war:()=>renderBattles('war'),
    defense:()=>renderBattles('defense'),
    settings:renderSettings
  })[id]();
}


/* =========================
   USERS
========================= */

async function renderUsers(){

  $('users').innerHTML=`
  <div class="box">

    <h2>➕ اضافه کردن کاربر جدید به مجموعه</h2>

    <div class="grid2">
      <input id="uCode" placeholder="POW678">
      <input id="uName" placeholder="نام">
    </div>

    <div class="grid2">
      <input id="uGames" type="number" min="0" placeholder="کل بازی‌ها">
      <input id="uWins" type="number" min="0" placeholder="پیروزی‌ها">
    </div>

    <input id="uDate" placeholder="تاریخ وفاداری (اختیاری)">

    <button class="btn primary" onclick="addUser()">
      ثبت کاربر
    </button>

  </div>`;
}

async function addUser(){

  try{

    await api('/api/admin/users',{
      method:'POST',
      headers:H(),
      body:JSON.stringify({

        code:$('uCode').value.trim(),

        name:$('uName').value.trim(),

        total_games:Number(
          $('uGames').value
        ),

        wins:Number(
          $('uWins').value
        ),

        loyalty_date:
          $('uDate').value.trim()||null

      })
    });

    alert('کاربر اضافه شد');

    renderUsers();

  }catch(e){

    alert(
      e.message||
      'خطا در ثبت کاربر'
    );

  }
}


/* =========================
   USER LIST
========================= */

async function renderUserList(){

  const us=await api(
    '/api/admin/users',
    {
      headers:H()
    }
  );

  $('userlist').innerHTML=
  '<div class="box">'+

  '<h2>👥 لیست کاربران مجموعه</h2>'+

  '<div class="table">'+

  '<table>'+

  '<tr>'+
  '<th>کد</th>'+
  '<th>نام</th>'+
  '<th>بازی</th>'+
  '<th>پیروزی</th>'+
  '<th>وفاداری</th>'+
  '<th>وضعیت</th>'+
  '<th>عملیات</th>'+
  '</tr>'+

  us.map(u=>`

    <tr>

      <td>${esc(u.code)}</td>

      <td>${esc(u.name)}</td>

      <td>${u.total_games}</td>

      <td>${u.wins??u.victories??0}</td>

      <td>${esc(u.loyalty_date)}</td>

      <td>
        ${
          u.blocked_until
          ?
          '<span class="dangerText">مسدود</span>'
          :
          '<span class="ok">فعال</span>'
        }
      </td>

      <td class="actions">

        <button
          class="btn"
          onclick="editUser(
            '${esc(u.code)}',
            '${esc(u.name)}',
            ${u.total_games},
            ${u.wins??u.victories??0}
          )">
          ویرایش
        </button>

        <button
          class="btn"
          onclick="blockUser('${esc(u.code)}')">
          مسدود
        </button>

        <button
          class="btn"
          onclick="unblock('${esc(u.code)}')">
          رفع مسدودی
        </button>

        <button
          class="btn danger"
          onclick="delUser('${esc(u.code)}')">
          حذف
        </button>

      </td>

    </tr>

  `).join('')+

  '</table>'+
  '</div>'+
  '</div>';
}

async function editUser(c,n,g,w){

  const nn=prompt('نام',n);

  if(nn===null)return;

  const gg=prompt(
    'کل بازی‌ها',
    g
  );

  const ww=prompt(
    'پیروزی‌ها',
    w
  );

  try{

    await api(
      '/api/admin/users/'+
      encodeURIComponent(c),
      {
        method:'PUT',
        headers:H(),
        body:JSON.stringify({
          name:nn,
          total_games:+gg,
          wins:+ww
        })
      }
    );

    renderUserList();

  }catch(e){

    alert(e.message);

  }
}

async function blockUser(c){

  const t=prompt(
    'نوع: permanent / season / month',
    'month'
  );

  if(
    ![
      'permanent',
      'season',
      'month'
    ].includes(t)
  )return;

  try{

    await api(
      '/api/admin/users/'+
      encodeURIComponent(c),
      {
        method:'PUT',
        headers:H(),
        body:JSON.stringify({
          action:'block',
          type:t
        })
      }
    );

    renderUserList();

  }catch(e){

    alert(e.message);

  }
}

async function unblock(c){

  try{

    await api(
      '/api/admin/users/'+
      encodeURIComponent(c),
      {
        method:'PUT',
        headers:H(),
        body:JSON.stringify({
          action:'unblock'
        })
      }
    );

    renderUserList();

  }catch(e){

    alert(e.message);

  }
}

async function delUser(c){

  if(
    !confirm(
      'این کاربر حذف شود؟'
    )
  )return;

  try{

    await api(
      '/api/admin/users/'+
      encodeURIComponent(c),
      {
        method:'DELETE',
        headers:H()
      }
    );

    renderUserList();

  }catch(e){

    alert(e.message);

  }
}


/* =========================
   ADD PLAYER
========================= */

async function renderAddPlayer(){

  const us=await api(
    '/api/admin/users',
    {
      headers:H()
    }
  );

  $('addplayer').innerHTML=`

  <div class="box">

    <h2>🌍 اضافه کردن بازیکن سیزن ۸</h2>

    <p class="muted">
      کاربر را انتخاب کنید و کشور آزاد را ثبت کنید.
    </p>

    <select id="pUser">

      ${
        us
        .filter(u=>!u.blocked_until)
        .map(u=>`

          <option value="${esc(u.code)}">

            ${esc(u.code)}
            —
            ${esc(u.name)}

          </option>

        `)
        .join('')
      }

    </select>

    <input
      id="pCountry"
      placeholder="کشور"
    >

    <input
      id="pOil"
      type="number"
      min="0"
      value="0"
      placeholder="نفت اولیه"
    >

    <button
      class="btn primary"
      onclick="addPlayer()">

      ثبت بازیکن

    </button>

  </div>`;
}

async function addPlayer(){

  try{

    await api(
      '/api/admin/players',
      {
        method:'POST',
        headers:H(),
        body:JSON.stringify({

          user_code:
            $('pUser').value,

          country:
            $('pCountry').value.trim(),

          oil:
            Number(
              $('pOil').value
            )

        })
      }
    );

    alert(
      'بازیکن سیزن ۸ ثبت شد'
    );

    renderAddPlayer();

  }catch(e){

    alert(
      e.message||
      'خطا در ثبت بازیکن'
    );

  }
}


/* =========================
   PLAYERS
========================= */

async function renderPlayers(){

  players=await api(
    '/api/admin/players',
    {
      headers:H()
    }
  );

  $('players').innerHTML=

  '<div class="box">'+

  '<h2>🌎 لیست بازیکنان سیزن ۸</h2>'+

  '<div class="table">'+

  '<table>'+

  '<tr>'+
  '<th>رتبه</th>'+
  '<th>کشور</th>'+
  '<th>کاربر</th>'+
  '<th>دلار</th>'+
  '<th>نفت</th>'+
  '<th>درآمد</th>'+
  '<th>عملیات</th>'+
  '</tr>'+

  players.map((p,i)=>`

    <tr>

      <td>${i+1}</td>

      <td>${esc(p.country)}</td>

      <td>
        ${esc(p.name)}
        (${esc(p.user_code)})
      </td>

      <td>
        $${fmt(p.dollars)}
      </td>

      <td>
        ${fmt(p.oil)}
      </td>

      <td>
        $${fmt(p.income_daily)}
      </td>

      <td>

        <button
          class="btn"
          onclick="changeCountry(
            ${p.id},
            '${esc(p.country)}'
          )">

          تغییر کشور

        </button>

      </td>

    </tr>

  `).join('')+

  '</table>'+
  '</div>'+
  '</div>';
}

async function changeCountry(id,c){

  const n=prompt(
    'کشور جدید',
    c
  );

  if(!n||n===c)return;

  try{

    await api(
      '/api/admin/players/'+id,
      {
        method:'PUT',
        headers:H(),
        body:JSON.stringify({
          action:'country',
          country:n
        })
      }
    );

    alert(
      'کشور تغییر کرد و دارایی‌ها پاک و موجودی ۱۰٬۰۰۰ دلار شد.'
    );

    renderPlayers();

  }catch(e){

    alert(e.message);

  }
}


/* =========================
   GRANT
========================= */

async function renderGrant(){

  if(!players.length){

    players=await api(
      '/api/admin/players',
      {
        headers:H()
      }
    );

  }

  if(!catalog){

    catalog=await api(
      '/api/catalog'
    );

  }

  const opts=[

    ['dollars','دلار'],

    ['oil','نفت'],

    ...Object
      .values(catalog.equipment)
      .flat()
      .map(x=>[
        x.key,
        x.name
      ]),

    ...catalog.income.map(x=>[
      x.key,
      x.name
    ])

  ];

  $('grant').innerHTML=`

  <div class="box">

    <h2>🎁 اهدای تجهیزات به بازیکن</h2>

    <select id="gPlayer">

      ${
        players.map(p=>`

          <option value="${p.id}">

            ${esc(p.country)}
            —
            ${esc(p.name)}

          </option>

        `).join('')
      }

    </select>

    <select id="gKind">

      ${
        opts.map(x=>`

          <option value="${x[0]}">

            ${esc(x[1])}

          </option>

        `).join('')
      }

    </select>

    <input
      id="gQty"
      type="number"
      min="1"
      value="1"
    >

    <button
      class="btn primary"
      onclick="grant()">

      اعطا

    </button>

  </div>`;
}


async function grant(){

  try{

    const playerId=Number(
      $('gPlayer').value
    );

    const kind=$('gKind').value;

    const quantity=Number(
      $('gQty').value
    );

    if(
      !Number.isInteger(playerId) ||
      playerId<1
    ){

      alert(
        'بازیکن را انتخاب کنید.'
      );

      return;
    }

    if(!kind){

      alert(
        'دارایی را انتخاب کنید.'
      );

      return;
    }

    if(
      !Number.isInteger(quantity) ||
      quantity<1
    ){

      alert(
        'تعداد باید حداقل ۱ باشد.'
      );

      return;
    }

    await api(
      '/api/admin/grant',
      {
        method:'POST',
        headers:H(),
        body:JSON.stringify({

          player_id:playerId,

          kind:kind,

          quantity:quantity

        })
      }
    );

    alert(
      'اعطا شد'
    );

    players=await api(
      '/api/admin/players',
      {
        headers:H()
      }
    );

    renderGrant();

  }catch(e){

    alert(
      e.message||
      'خطا در اعطای دارایی'
    );

  }
}

/* =========================
   BATTLES
========================= */

async function renderBattles(mode){

  const r=(
    await api(
      '/api/admin/battles',
      {
        headers:H()
      }
    )
  ).filter(
    x=>x.mode===mode
  );

  const el=$(
    mode==='war'
    ? 'war'
    : 'defense'
  );

  el.innerHTML=

  '<div class="box">'+

  '<h2>'+
  (
    mode==='war'
    ? '⚔️ سناریوهای جنگی'
    : '🛡️ سناریوهای دفاعی'
  )+
  '</h2>'+

  (

    r.length

    ?

    r.map(b=>`

      <div class="scenario">

        <b>
          ${esc(b.attacker_country)}
          →
          ${esc(b.defender_country)}
        </b>

        <p class="muted">
          ${esc(b.created_at)}
        </p>

        <h3>سناریو</h3>

        <pre>
${esc(b.scenario)}
        </pre>

        <h3>تجهیزات</h3>

        ${
          b.assets.map(a=>`

            <p>
              ${esc(a.asset_key)}
              —
              ${fmt(a.quantity)}
            </p>

          `).join('')
        }

        <div class="actions">

          <button
            class="btn primary"
            onclick="review(
              ${b.id},
              true,
              '${mode}'
            )">

            ✓ خوانده‌ام / تأیید

          </button>

          <button
            class="btn danger"
            onclick="review(
              ${b.id},
              false,
              '${mode}'
            )">

            رد سناریو

          </button>

        </div>

      </div>

    `).join('')

    :

    '<p class="muted">سناریوی منتظر بررسی وجود ندارد.</p>'

  )+

  '</div>';
}

async function review(
  id,
  approved,
  mode
){

  try{

    await api(
      '/api/admin/battles/'+id,
      {
        method:'PUT',
        headers:H(),
        body:JSON.stringify({
          approved
        })
      }
    );

    renderBattles(mode);

  }catch(e){

    alert(e.message);

  }
}


/* =========================
   SETTINGS
========================= */

async function renderSettings(){

  const s=await api(
    '/api/season/settings'
  );

  $('settings').innerHTML=`

  <div class="box">

    <h2>🔥 مدیریت جنگ</h2>

    <p>
      وضعیت:

      <b class="${
        s.war_enabled
        ? 'ok'
        : 'dangerText'
      }">

        ${
          s.war_enabled
          ? 'فعال'
          : 'غیرفعال'
        }

      </b>
    </p>

    <div class="actions">

      <button
        class="btn primary"
        onclick="setWar(true)">

        فعال کردن جنگ

      </button>

      <button
        class="btn danger"
        onclick="setWar(false)">

        غیرفعال کردن جنگ

      </button>

    </div>

    <hr
      style="
        border-color:#2a383f;
        margin:22px 0
      "
    >

    <h2>₿ قیمت بیت‌کوین</h2>

    <input
      id="btc"
      type="number"
      value="${s.bitcoin_price}"
    >

    <button
      class="btn primary"

      ثبت قیمت

    </button>

  </div>`;
}

async function setWar(e){

  try{

    await api(
      '/api/admin/war',
      {
        method:'POST',
        headers:H(),
        body:JSON.stringify({
          enabled:e
        })
      }
    );

    renderSettings();

  }catch(err){

    alert(err.message);

  }
}

async function setBtc(){

  try{

    const price=Number(
      $('btc').value
    );

    if(
      !Number.isFinite(price) ||
      price<0
    ){

      alert(
        'قیمت واردشده صحیح نیست.'
      );

      return;
    }

    await api(
      '/api/admin/bitcoin',
      {
        method:'POST',
        headers:H(),
        body:JSON.stringify({
          price
        })
      }
    );

    alert(
      'قیمت بیت‌کوین ثبت شد.'
    );

    renderSettings();

  }catch(e){

    alert(e.message);

  }
}


/* =========================
   ESCAPE
========================= */

function esc(v){

  return String(
    v??''
  ).replace(
    /[&<>"']/g,
    c=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'

    }[c])
  );
}


/* =========================
   AUTO LOGIN
========================= */

(async()=>{

  if(token){

    try{

      await api(
        '/api/admin/users',
        {
          headers:H()
        }
      );

      showDash();

      openView('users');

    }catch{

      logout();

    }

  }

})();
  </script>
