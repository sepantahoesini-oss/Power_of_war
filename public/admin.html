<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POWER OF WAR | مدیریت سیزن ۸</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#070a0c;--p:#11191d;--line:#2a383f;--g:#8dff9a;--y:#ffe56a;--r:#ff5968;--m:#8e9b9f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#050708,#0b1114,#050708);color:#f4f7f5;font-family:Vazirmatn,Tahoma}.wrap{width:min(1250px,94%);margin:auto}header{border-bottom:1px solid #8dff9a22;background:#06090bea;position:sticky;top:0;z-index:10}.nav{height:68px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:var(--g)}.brand span{color:var(--y)}.login{width:min(430px,100%);margin:100px auto;background:var(--p);border:1px solid var(--line);border-radius:20px;padding:25px}input,select,button{font:inherit}input,select{width:100%;padding:12px;margin:7px 0;background:#080d0f;border:1px solid #344249;border-radius:10px;color:#fff}.btn{border:1px solid #39484f;background:#11191d;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:var(--g);color:#061009;border:0;font-weight:900}.danger{color:#ff9aa4;border-color:#ff596855}.dashboard{display:none}.layout{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:20px 0}.side,.box{background:linear-gradient(145deg,#151f23f5,#0a0f11f5);border:1px solid var(--line);border-radius:17px;padding:15px}.side button{display:block;width:100%;text-align:right;margin:6px 0}.view{display:none}.view.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}.table table{width:100%;min-width:850px;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #202a2f;text-align:right}.table th{color:var(--g);background:#121a1e}.actions{display:flex;gap:6px;flex-wrap:wrap}.scenario{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0;background:#0d1417}.scenario pre{white-space:pre-wrap;background:#080d0f;padding:12px;border-radius:10px;line-height:2}.muted{color:var(--m)}.dangerText{color:#ff8f9a}.ok{color:var(--g)}@media(max-width:850px){.layout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.side{position:static}}</style></head><body><header><div class="wrap nav"><div class="brand">POWER <span>OF WAR</span> — مدیریت سیزن ۸</div><button class="btn" onclick="logout()">خروج</button></div></header><main class="wrap"><div id="login" class="login"><h2>🔐 ورود مدیریت</h2><input id="password" type="password" placeholder="رمز مدیریت"><button class="btn primary" style="width:100%" onclick="login()">ورود</button><p id="msg" class="dangerText"></p></div><div id="dash" class="dashboard"><div class="layout"><aside class="side"><button class="btn" onclick="openView('users')">➕ اضافه کردن کاربر جدید</button><button class="btn" onclick="openView('userlist')">👥 لیست کاربران مجموعه</button><button class="btn" onclick="openView('addplayer')">🌍 اضافه کردن بازیکن سیزن ۸</button><button class="btn" onclick="openView('players')">🌎 لیست بازیکنان سیزن ۸</button><button class="btn" onclick="openView('grant')">🎁 اهدای تجهیزات / دلار</button><button class="btn" onclick="openView('transactions')">💳 تراکنش‌های خرید</button><button class="btn" onclick="openView('war')">⚔️ سناریوهای جنگی</button><button class="btn" onclick="openView('defense')">🛡️ سناریوهای دفاعی</button><button class="btn" onclick="openView('settings')">🔥 جنگ / ₿ بیت‌کوین</button><button class="btn" onclick="openView('contracts')">📜 قراردادها / توقیف</button></aside><section><div id="users" class="view"></div><div id="userlist" class="view"></div><div id="addplayer" class="view"></div><div id="players" class="view"></div><div id="grant" class="view"></div><div id="transactions" class="view"></div><div id="war" class="view"></div><div id="defense" class="view"></div><div id="settings" class="view"></div><div id="contracts" class="view"></div></section></div></div></main>
<script>let token=sessionStorage.getItem('s8_admin')||'',catalog=null,players=[];const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('en-US'),H=()=>({authorization:'Bearer '+token,'content-type':'application/json'});async function api(p,o={}){const r=await fetch(p,{cache:'no-store',...o});const d=await r.json().catch(()=>({message:'خطا'}));if(!r.ok)throw Error(d.message||'خطا');return d}async function login(){try{const d=await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('password').value})});token=d.token;sessionStorage.setItem('s8_admin',token);showDash();openView('users')}catch(e){$('msg').textContent=e.message}}function showDash(){$('login').style.display='none';$('dash').style.display='block'}function logout(){token='';sessionStorage.removeItem('s8_admin');location.reload()}function openView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');({users:renderUsers,userlist:renderUserList,addplayer:renderAddPlayer,players:renderPlayers,grant:renderGrant,transactions:renderTransactions,war:()=>renderBattles('war'),defense:()=>renderBattles('defense'),settings:renderSettings,contracts:renderContracts})[id]()}async function renderUsers(){$('users').innerHTML=`<div class="box"><h2>➕ اضافه کردن کاربر جدید به مجموعه</h2><div class="grid2"><input id="uCode" placeholder="POW678"><input id="uName" placeholder="نام"></div><div class="grid2"><input id="uGames" type="number" min="0" placeholder="کل بازی‌ها"><input id="uWins" type="number" min="0" placeholder="پیروزی‌ها"></div><input id="uDate" placeholder="تاریخ وفاداری (اختیاری)"><button class="btn primary" onclick="addUser()">ثبت کاربر</button></div>`}async function addUser(){try{await api('/api/admin/users',{method:'POST',headers:H(),body:JSON.stringify({code:uCode.value,name:uName.value,total_games:+uGames.value,wins:+uWins.value,loyalty_date:uDate.value||null})});alert('کاربر اضافه شد');renderUsers()}catch(e){alert(e.message)}}async function renderUserList(){const us=await api('/api/admin/users',{headers:H()});$('userlist').innerHTML='<div class="box"><h2>👥 لیست کاربران مجموعه</h2><div class="table"><table><tr><th>کد</th><th>نام</th><th>بازی</th><th>پیروزی</th><th>وفاداری</th><th>وضعیت</th><th>عملیات</th></tr>'+us.map(u=>`<tr><td>${esc(u.code)}</td><td>${esc(u.name)}</td><td>${u.total_games}</td><td>${u.wins??u.victories??0}</td><td>${esc(u.loyalty_date)}</td><td>${u.blocked_until?'<span class="dangerText">مسدود</span>':'<span class="ok">فعال</span>'}</td><td class="actions"><button class="btn" onclick="editUser('${esc(u.code)}','${esc(u.name)}',${u.total_games},${u.wins??u.victories??0})">ویرایش</button><button class="btn" onclick="blockUser('${esc(u.code)}')">مسدود</button><button class="btn" onclick="unblock('${esc(u.code)}')">رفع مسدودی</button><button class="btn danger" onclick="delUser('${esc(u.code)}')">حذف</button></td></tr>`).join('')+'</table></div></div>'}async function editUser(c,n,g,w){const nn=prompt('نام',n);if(nn===null)return;const gg=prompt('کل بازی‌ها',g),ww=prompt('پیروزی‌ها',w);try{await api('/api/admin/users/'+encodeURIComponent(c),{method:'PUT',headers:H(),body:JSON.stringify({name:nn,total_games:+gg,wins:+ww})});renderUserList()}catch(e){alert(e.message)}}async function blockUser(c){const t=prompt('نوع: permanent / season / month','month');if(!['permanent','season','month'].includes(t))return;try{await api('/api/admin/users/'+encodeURIComponent(c),{method:'PUT',headers:H(),body:JSON.stringify({action:'block',type:t})});renderUserList()}catch(e){alert(e.message)}}async function unblock(c){await api('/api/admin/users/'+encodeURIComponent(c),{method:'PUT',headers:H(),body:JSON.stringify({action:'unblock'})});renderUserList()}async function delUser(c){if(!confirm('این کاربر حذف شود؟'))return;await api('/api/admin/users/'+encodeURIComponent(c),{method:'DELETE',headers:H()});renderUserList()}
async function renderAddPlayer(){const us=await api('/api/admin/users',{headers:H()});$('addplayer').innerHTML=`<div class="box"><h2>🌍 اضافه کردن بازیکن سیزن ۸</h2><p class="muted">کاربر را انتخاب کنید و کشور آزاد را ثبت کنید.</p><select id="pUser">${us.filter(u=>!u.blocked_until).map(u=>`<option value="${esc(u.code)}">${esc(u.code)} — ${esc(u.name)}</option>`).join('')}</select><input id="pCountry" placeholder="کشور"><input id="pOil" type="number" min="0" value="0" placeholder="نفت اولیه"><button class="btn primary" onclick="addPlayer()">ثبت بازیکن</button></div>`}async function addPlayer(){try{await api('/api/admin/players',{method:'POST',headers:H(),body:JSON.stringify({user_code:pUser.value,country:pCountry.value,oil:+pOil.value})});alert('بازیکن سیزن ۸ ثبت شد');renderAddPlayer()}catch(e){alert(e.message)}}async function renderPlayers(){players=await api('/api/admin/players',{headers:H()});$('players').innerHTML='<div class="box"><h2>🌎 لیست بازیکنان سیزن ۸</h2><div class="table"><table><tr><th>رتبه</th><th>کشور</th><th>کاربر</th><th>دلار</th><th>نفت</th><th>درآمد</th><th>عملیات</th></tr>'+players.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.country)}</td><td>${esc(p.name)} (${esc(p.user_code)})</td><td>$${fmt(p.dollars)}</td><td>${fmt(p.oil)}</td><td>$${fmt(p.income_daily)}</td><td><button class="btn" onclick="changeCountry(${p.id},'${esc(p.country)}')">تغییر کشور</button></td></tr>`).join('')+'</table></div></div>'}async function changeCountry(id,c){const n=prompt('کشور جدید',c);if(!n||n===c)return;try{await api('/api/admin/players/'+id,{method:'PUT',headers:H(),body:JSON.stringify({action:'country',country:n})});alert('کشور تغییر کرد و دارایی‌ها پاک و موجودی ۱۰٬۰۰۰ دلار شد.');renderPlayers()}catch(e){alert(e.message)}}async function renderGrant(){if(!players.length)players=await api('/api/admin/players',{headers:H()});if(!catalog)catalog=await api('/api/catalog');const opts=[['dollars','دلار'],['oil','نفت'],...Object.values(catalog.equipment).flat().map(x=>[x.key,x.name]),...catalog.income.map(x=>[x.key,x.name])];$('grant').innerHTML=`<div class="box"><h2>🎁 اهدای تجهیزات به بازیکن</h2><select id="gPlayer">${players.map(p=>`<option value="${p.id}">${esc(p.country)} — ${esc(p.name)}</option>`).join('')}</select><select id="gKind">${opts.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select><input id="gQty" type="number" min="1" value="1"><button class="btn primary" onclick="grant()">اعطا</button></div>`}async function grant(){try{await api('/api/admin/grant',{method:'POST',headers:H(),body:JSON.stringify({player_id:+gPlayer.value,kind:gKind.value,quantity:+gQty.value})});alert('اعطا شد')}catch(e){alert(e.message)}}async function renderTransactions(){const r=await api('/api/admin/transactions',{headers:H()});$('transactions').innerHTML='<div class="box"><h2>💳 تراکنش خرید همه بازیکنان</h2><div class="table"><table><tr><th>شناسه</th><th>کشور</th><th>نوع</th><th>شرح</th><th>تعداد</th><th>مبلغ</th><th>زمان</th></tr>'+r.map(x=>`<tr><td>${esc(x.tx_code)}</td><td>${esc(x.country||'-')}</td><td>${esc(x.type)}</td><td>${esc(x.description)}</td><td>${fmt(x.quantity)}</td><td>$${fmt(x.amount)}</td><td>${esc(x.created_at)}</td></tr>`).join('')+'</table></div></div>'}async function renderBattles(mode){const r=(await api('/api/admin/battles',{headers:H()})).filter(x=>x.mode===mode),el=$(mode==='war'?'war':'defense');el.innerHTML='<div class="box"><h2>'+ (mode==='war'?'⚔️ سناریوهای جنگی':'🛡️ سناریوهای دفاعی')+'</h2>'+(r.length?r.map(b=>`<div class="scenario"><b>${esc(b.attacker_country)} → ${esc(b.defender_country)}</b><p class="muted">${esc(b.created_at)}</p><h3>سناریو</h3><pre>${esc(b.scenario)}</pre><h3>تجهیزات</h3>${b.assets.map(a=>`<p>${esc(a.asset_key)} — ${fmt(a.quantity)}</p>`).join('')}<div class="actions"><button class="btn primary" onclick="review(${b.id},true,'${mode}')">✓ خوانده‌ام / تأیید</button><button class="btn danger" onclick="review(${b.id},false,'${mode}')">رد سناریو</button></div></div>`).join(''):'<p class="muted">سناریوی منتظر بررسی وجود ندارد.</p>')+'</div>'}async function review(id,approved,mode){try{await api('/api/admin/battles/'+id,{method:'PUT',headers:H(),body:JSON.stringify({approved})});renderBattles(mode)}catch(e){alert(e.message)}}async function renderContracts(){const [cs,ds,is]=await Promise.all([api('/api/admin/contracts',{headers:H()}),api('/api/admin/detentions',{headers:H()}),api('/api/admin/income-seizure',{headers:H()})]);const ps=await api('/api/admin/players',{headers:H()});$('contracts').innerHTML=`<div class="box"><h2>📜 مدیریت قراردادها</h2><div class="table"><table><tr><th>فرستنده</th><th>گیرنده</th><th>شروع</th><th>پایان</th><th>وضعیت</th><th>عملیات</th></tr>${cs.map(c=>`<tr><td>${esc(c.sender_country)}</td><td>${esc(c.receiver_country)}</td><td>${esc(c.start_date)}</td><td>${esc(c.end_date)}</td><td>${esc(c.status)}</td><td><button class="btn danger" onclick="cancelContract(${c.id})">لغو</button></td></tr>`).join('')}</table></div><hr style="border-color:#2a383f;margin:22px 0"><h2>⛓️ توقیف کشور</h2><select id="detPlayer">${ps.map(x=>`<option value="${x.id}">${esc(x.country)} — ${esc(x.name)}</option>`).join('')}</select><input id="detDollar" type="number" min="0" placeholder="مقدار دلار برای توقیف"><input id="detReason" placeholder="دلیل توقیف"><button class="btn danger" onclick="detain()">توقیف</button><h3>توقیف‌های ثبت‌شده</h3>${ds.map(d=>`<p>${esc(d.country)} — ${esc(d.name)} — ${esc(d.reason||'بدون دلیل')} — ${esc(d.created_at)}</p>`).join('')||'<p class="muted">موردی ثبت نشده.</p>'}<hr style="border-color:#2a383f;margin:22px 0"><h2>💰 توقیف درآمد</h2><div class="table"><table><tr><th>کشور</th><th>نام</th><th>وضعیت</th><th>عملیات</th></tr>${is.map(x=>`<tr><td>${esc(x.country)}</td><td>${esc(x.name)}</td><td>${Number(x.income_seized)?'توقیف شده':'فعال'}</td><td><button class="btn ${Number(x.income_seized)?'primary':'danger'}" onclick="toggleIncome(${x.id},${Number(x.income_seized)?'false':'true'})">${Number(x.income_seized)?'رفع توقیف':'توقیف درآمد'}</button></td></tr>`).join('')}</table></div></div>`}
async function cancelContract(id){const r=prompt('دلیل لغو','لغو توسط ادمین');if(r===null)return;try{await api('/api/admin/contracts/'+id+'/cancel',{method:'POST',headers:H(),body:JSON.stringify({reason:r})});renderContracts()}catch(e){alert(e.message)}}
async function detain(){try{await api('/api/admin/detention',{method:'POST',headers:H(),body:JSON.stringify({player_id:+detPlayer.value,dollars:+detDollar.value,reason:detReason.value,items:{}})});alert('توقیف انجام شد');renderContracts()}catch(e){alert(e.message)}}
async function toggleIncome(id,enabled){try{await api('/api/admin/income-seizure',{method:'POST',headers:H(),body:JSON.stringify({player_id:id,enabled})});renderContracts()}catch(e){alert(e.message)}}
async function renderSettings(){const s=await api('/api/season/settings');$('settings').innerHTML=`<div class="box"><h2>🔥 مدیریت جنگ</h2><p>وضعیت: <b class="${s.war_enabled?'ok':'dangerText'}">${s.war_enabled?'فعال':'غیرفعال'}</b></p><div class="actions"><button class="btn primary" onclick="setWar(true)">فعال کردن جنگ</button><button class="btn danger" onclick="setWar(false)">غیرفعال کردن جنگ</button></div><hr style="border-color:#2a383f;margin:22px 0"><h2>₿ قیمت بیت‌کوین</h2><input id="btc" type="number" value="${s.bitcoin_price}"><button class="btn primary" onclick="setBtc()">ثبت قیمت</button></div>`}async function setWar(e){await api('/api/admin/war',{method:'POST',headers:H(),body:JSON.stringify({enabled:e})});renderSettings()}async function setBtc(){await api('/api/admin/bitcoin',{method:'POST',headers:H(),body:JSON.stringify({price:+btc.value})});renderSettings()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}(async()=>{if(token){try{await api('/api/admin/users',{headers:H()});showDash();openView('users')}catch{logout()}}})();</script></body></html>
