<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | POWER OF WAR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma;background:#070a0c;color:#f5f7f6}.wrap{width:min(1100px,92%);margin:auto}.top{height:74px;border-bottom:1px solid #263238;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;color:#8dff9a}.logo span{color:#ffe56a}.btn,.back{border:1px solid #37434a;background:#11181b;color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font-family:inherit}.btn.primary{background:#8dff9a;color:#061009;border:0;font-weight:900}.danger{color:#ff7883;border-color:#59252e!important;background:#211014!important}main{padding:35px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.box,.panel,.user{background:#10161a;border:1px solid #263238;border-radius:18px;padding:24px}.panel{cursor:pointer;min-height:145px}.panel:hover{border-color:#8dff9a}input{width:100%;padding:13px;margin:7px 0 13px;background:#080d0f;border:1px solid #303c42;border-radius:10px;color:#fff;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.muted{color:#899599}.user{margin:10px 0;padding:16px}.actions{display:flex;gap:8px;margin-top:12px}.msg{color:#8dff9a}.err{color:#ff6672}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="wrap" style="max-width:430px;padding-top:15vh"><div class="box"><h1>🔐 پنل مدیریت</h1><p class="muted">POWER OF WAR</p><input id="password" type="password" placeholder="رمز مدیریت" onkeydown="if(event.key==='Enter')loginAdmin()"><button class="btn primary" style="width:100%" onclick="loginAdmin()">ورود</button><p id="loginMsg" class="err"></p></div></div>
<div id="app" class="hidden"><header class="top wrap"><div class="logo">POWER <span>OF WAR</span> — مدیریت</div><button class="btn" onclick="logout()">خروج</button></header><main class="wrap">
<section id="dash"><h2>داشبورد مدیریت</h2><div class="grid"><div class="panel" onclick="show('add')"><h3>➕ اضافه کردن کاربر جدید</h3><p class="muted">ثبت کد، نام و اطلاعات بازی</p></div><div class="panel" onclick="show('list')"><h3>👥 لیست کاربران مجموعه</h3><p class="muted">مشاهده، ویرایش و حذف کاربران</p></div></div></section>
<section id="add" class="box hidden"><button class="back" onclick="show('dash')">بازگشت</button><h2>➕ اضافه کردن کاربر جدید</h2><label>کد کاربر</label><input id="code" placeholder="مثلاً POW678"><label>نام کاربر</label><input id="name" placeholder="نام"><div class="row"><div><label>تعداد کل بازی‌ها</label><input id="total" type="number" min="0" value="0"></div><div><label>تعداد بازی‌های انجام‌شده</label><input id="played" type="number" min="0" value="0"></div></div><button class="btn primary" onclick="saveUser()">ثبت کاربر</button><p id="addMsg"></p></section>
<section id="list" class="box hidden"><button class="back" onclick="show('dash')">بازگشت</button><h2>👥 لیست کاربران مجموعه</h2><div id="users"></div></section>
</main></div>
<script>
let token=sessionStorage.getItem('pow_admin_token')||'';
async function loginAdmin(){const p=document.getElementById('password').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok){document.getElementById('loginMsg').textContent='رمز اشتباه است.';return}const d=await r.json();token=d.token;sessionStorage.setItem('pow_admin_token',token);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
function logout(){sessionStorage.removeItem('pow_admin_token');location.reload()}
function show(id){['dash','add','list'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='list')render()}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'content-type':'application/json'};const r=await fetch(url,opt);if(r.status===401){logout();throw Error('auth')}return r}
async function saveUser(){
 const c=document.getElementById('code').value.trim().toUpperCase(),n=document.getElementById('name').value.trim(),t=Number(document.getElementById('total').value)||0,p=Number(document.getElementById('played').value)||0,m=document.getElementById('addMsg');
 if(!/^POW\d+$/.test(c)){m.className='err';m.textContent='کد باید با POW شروع شود و بعد از آن فقط عدد باشد.';return}
 if(!n){m.className='err';m.textContent='نام را وارد کنید.';return}if(p>t){m.className='err';m.textContent='بازی‌های انجام‌شده نمی‌تواند بیشتر از کل بازی‌ها باشد.';return}
 const r=await api('/api/admin/users',{method:'POST',body:JSON.stringify({code:c,name:n,total_games:t,played_games:p})});const d=await r.json();
 m.className=r.ok?'msg':'err';m.textContent=d.message|| (r.ok?'کاربر ثبت شد.':'خطا در ثبت کاربر.');
 if(r.ok){document.getElementById('code').value='';document.getElementById('name').value='';document.getElementById('total').value=0;document.getElementById('played').value=0}
}
async function render(){const r=await api('/api/admin/users');const u=await r.json();document.getElementById('users').innerHTML=u.length?u.map(x=>`<div class="user"><b>${esc(x.name)}</b><div class="muted">کد: ${esc(x.code)} | کل: ${x.total_games} | انجام‌شده: ${x.played_games}</div><div class="actions"><button class="btn primary" onclick="editUser('${x.code}')">ویرایش</button><button class="btn danger" onclick="deleteUser('${x.code}')">حذف</button></div></div>`).join(''):'<p class="muted">هنوز کاربری ثبت نشده است.</p>'}
async function editUser(c){const r=await api('/api/admin/users/'+encodeURIComponent(c));if(!r.ok)return;const x=await r.json();const n=prompt('نام کاربر:',x.name);if(n===null)return;const t=prompt('تعداد کل بازی‌ها:',x.total_games);if(t===null)return;const p=prompt('تعداد بازی‌های انجام‌شده:',x.played_games);if(p===null)return;const T=Number(t),P=Number(p);if(!n.trim()||T<0||P<0||P>T){alert('اطلاعات نامعتبر است.');return}const z=await api('/api/admin/users/'+encodeURIComponent(c),{method:'PUT',body:JSON.stringify({name:n.trim(),total_games:T,played_games:P})});if(z.ok)render();else alert((await z.json()).message||'خطا')}
async function deleteUser(c){if(!confirm('این کاربر حذف شود؟'))return;const r=await api('/api/admin/users/'+encodeURIComponent(c),{method:'DELETE'});if(r.ok)render();else alert('خطا در حذف')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
if(token){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}
</script></body></html>
